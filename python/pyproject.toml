[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simian"
version = "1.0.0"
description = "A small laboratory for matter, heat, and unexpected behavior."
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "numba>=0.60", "PySide6-Essentials>=6.7"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
simian = "simian.app:main"

[tool.setuptools]
packages = ["simian"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
